[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's developer menu (deploy, rerun, settings)
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#8B7CFF"
backgroundColor = "#0B0B10"
secondaryBackgroundColor = "#15151D"
textColor = "#F4F4F6"
linkColor = "#A99CFF"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
baseRadius = "0.75rem"
buttonRadius = "full"
borderColor = "#24242E"
showWidgetBorder = true
dataframeBorderColor = "#24242E"
dataframeHeaderBackgroundColor = "#15151D"
